version: '3.8'

services:
  veritas-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-ai-service
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VeritasAI
      - MODEL_PATH=/app/saved_model
      - DEVICE=cpu
      - MAX_SEQUENCE_LENGTH=128
      - ENABLE_EXTERNAL_SEARCH=True
    volumes:
      # Mount host saved_model directory to avoid baking 438MB weights into docker layer
      - ./saved_model:/app/saved_model:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
